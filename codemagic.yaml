# Codemagic CI/CD for twiffel-app.
# Full setup walkthrough + gotchas: harness/infrastructure-setup.md (step 4).
# Store / RC launch order: harness/store-launch-checklist.md
#
# Secrets SoT = Doppler. Prefer Codemagic holding only:
#   twiffel_ci       — DOPPLER_TOKEN (service token for config `ci` or `prd`)
#   twiffel_runtime  — TWIFFEL_API_BASE
# then wrap builds with: doppler run --project twiffel --config ci -- <command>
#
# Fallback (mirror from Doppler into Codemagic groups — do not invent a 2nd SoT):
#   twiffel_github  — TWIFFEL_GITHUB_TOKEN
#   twiffel_runtime — TWIFFEL_API_BASE
#   twiffel_secrets — TWIFFEL_RC_KEY_*, TWIFFEL_CM_KEYSTORE*
#
# Bundle ID: com.uthings.twiffel
# ASC integration name suggestion: twiffel_asc
# Groups are app-level (free plan has no team groups); names here must match
# the groups created on the app's Environment variables page exactly.

definitions:
  scripts:
    - &configure_private_git
      name: Configure Git for private pub dependencies
      script: |
        TOKEN="${TWIFFEL_GITHUB_TOKEN:-${GITHUB_TOKEN:-}}"
        if [ -z "$TOKEN" ]; then
          echo "TWIFFEL_GITHUB_TOKEN (or GITHUB_TOKEN) is not set."
          exit 1
        fi
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
    - &load_doppler_if_configured
      name: Load secrets from Doppler (optional)
      script: |
        # If DOPPLER_TOKEN is set, install CLI and export secrets into the job env.
        # Skip silently when using Codemagic env-group fallback.
        if [ -z "${DOPPLER_TOKEN:-}" ]; then
          echo "DOPPLER_TOKEN unset — using Codemagic env groups."
          exit 0
        fi
        if [ -z "${DOPPLER_PROJECT:-}" ]; then
          echo "DOPPLER_TOKEN set but DOPPLER_PROJECT missing (e.g. twiffel)."
          exit 1
        fi
        DOPPLER_CONFIG="${DOPPLER_CONFIG:-ci}"
        curl -Ls https://cli.doppler.com/install.sh | sh -s -- --no-install-pkgs
        # Export KEY=value pairs for subsequent scripts in this job.
        # (Codemagic does not keep shell exports across script steps unless written
        #  to CM_ENV / a file — use doppler run on the build step instead if needed.)
        doppler secrets download \
          --project "$DOPPLER_PROJECT" \
          --config "$DOPPLER_CONFIG" \
          --no-file --format env >> "$CM_ENV"
        echo "Doppler secrets loaded into CM_ENV (project=$DOPPLER_PROJECT config=$DOPPLER_CONFIG)."
    - &pub_get
      name: Resolve dependencies
      script: flutter pub get

workflows:
  android:
    name: Twiffel Android
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        # Preferred thin CI: twiffel_ci (DOPPLER_TOKEN) + twiffel_runtime
        # Fallback: twiffel_github + twiffel_runtime + twiffel_secrets
        - twiffel_github
        - twiffel_runtime
        - twiffel_secrets
    scripts:
      - *load_doppler_if_configured
      - *configure_private_git
      - *pub_get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build App Bundle
        script: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=TWIFFEL_API_BASE="$TWIFFEL_API_BASE" \
            --dart-define=TWIFFEL_RC_KEY_ANDROID="$TWIFFEL_RC_KEY_ANDROID"
    artifacts:
      - build/app/outputs/**/*.aab

  ios-smoke:
    name: Twiffel iOS (smoke)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - twiffel_github
        - twiffel_runtime
        - twiffel_secrets
    scripts:
      - *load_doppler_if_configured
      - *configure_private_git
      - *pub_get
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build iOS (unsigned)
        script: flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"
    artifacts:
      - build/ios/iphoneos/Runner.app
