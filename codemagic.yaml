# Codemagic CI/CD for twiffel-app.
# Full setup walkthrough + gotchas: harness/infrastructure-setup.md (step 4).
# Store / RC launch order: harness/store-launch-checklist.md
# First-builds task: tasks/task-001-first-builds.md
#
# Secrets SoT = Doppler. Codemagic holds only:
#   twiffel_ci       — DOPPLER_TOKEN, DOPPLER_PROJECT=twiffel, DOPPLER_CONFIG=ci
#   twiffel_runtime  — TWIFFEL_API_BASE
#
# Doppler `ci` (or `prd`) should contain:
#   TWIFFEL_GITHUB_TOKEN, TWIFFEL_CM_KEYSTORE*, TWIFFEL_RC_KEY_* (RC optional at first)
#
# Fallback (mirror from Doppler — do not invent a 2nd SoT): add groups
#   twiffel_github / twiffel_secrets and list them under `groups:` below.
#
# Bundle ID: com.uthings.twiffel
# ASC integration name: twiffel_asc
# Start builds from the codemagic.yaml tab (not Workflow Editor).

definitions:
  scripts:
    - &configure_private_git
      name: Configure Git for private pub dependencies
      script: |
        TOKEN="${TWIFFEL_GITHUB_TOKEN:-${GITHUB_TOKEN:-}}"
        if [ -z "$TOKEN" ]; then
          echo "TWIFFEL_GITHUB_TOKEN (or GITHUB_TOKEN) is not set."
          echo "Put it in Doppler config ci, or set DOPPLER_TOKEN so secrets load."
          exit 1
        fi
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
    - &load_doppler_if_configured
      name: Load secrets from Doppler
      script: |
        # Doppler-first: these workflows require twiffel_ci (DOPPLER_TOKEN + project + config).
        # Do not soft-skip — a silent skip looks green and fails later on missing GitHub PAT.
        if [ -z "${DOPPLER_TOKEN:-}" ]; then
          echo "DOPPLER_TOKEN is not set in Codemagic group twiffel_ci."
          echo "Create: doppler configs tokens create --name twiffel-codemagic-ci --project twiffel --config ci --plain"
          exit 1
        fi
        if [ -z "${DOPPLER_PROJECT:-}" ]; then
          echo "DOPPLER_PROJECT missing (expected: twiffel) in group twiffel_ci."
          exit 1
        fi
        DOPPLER_CONFIG="${DOPPLER_CONFIG:-ci}"
        # install.sh requires GnuPG for signature verification. Codemagic Mac images
        # often lack gpg; `--no-install-pkgs` then fails and every secret looks "missing".
        if command -v brew >/dev/null 2>&1; then
          brew list gnupg >/dev/null 2>&1 || brew install gnupg
          brew list doppler >/dev/null 2>&1 || brew install dopplerhq/cli/doppler
        elif command -v apt-get >/dev/null 2>&1; then
          sudo apt-get update -y
          sudo apt-get install -y gnupg
          curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh
        else
          curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh
        fi
        command -v doppler >/dev/null 2>&1 || { echo "doppler CLI failed to install"; exit 1; }
        doppler --version
        # Append each app secret as KEY=value. Avoid `doppler … --format env` quotes /
        # multiline breakage from large keystore values that can drop later keys in CM_ENV.
        count=0
        for key in \
          TWIFFEL_GITHUB_TOKEN \
          TWIFFEL_CM_KEYSTORE \
          TWIFFEL_CM_KEYSTORE_PASSWORD \
          TWIFFEL_CM_KEY_ALIAS \
          TWIFFEL_CM_KEY_PASSWORD \
          TWIFFEL_RC_KEY_ANDROID \
          TWIFFEL_RC_KEY_IOS \
          TWIFFEL_XAI_MODEL
        do
          if ! doppler secrets get "$key" \
              --project "$DOPPLER_PROJECT" \
              --config "$DOPPLER_CONFIG" \
              --plain > /tmp/cm_doppler_val 2>/tmp/cm_doppler_err; then
            # RC keys are optional for first binaries; everything else should exist in ci.
            case "$key" in
              TWIFFEL_RC_KEY_*)
                echo "skip optional missing Doppler secret: $key"
                ;;
              *)
                echo "failed to read required Doppler secret: $key"
                cat /tmp/cm_doppler_err >&2 || true
                exit 1
                ;;
            esac
            continue
          fi
          printf '%s=' "$key" >> "$CM_ENV"
          cat /tmp/cm_doppler_val >> "$CM_ENV"
          printf '\n' >> "$CM_ENV"
          count=$((count + 1))
          echo "loaded $key"
        done
        rm -f /tmp/cm_doppler_val /tmp/cm_doppler_err
        if ! grep -q "^TWIFFEL_GITHUB_TOKEN=" "$CM_ENV"; then
          echo "Doppler ci did not provide TWIFFEL_GITHUB_TOKEN (check Doppler config ci)."
          exit 1
        fi
        echo "Doppler secrets loaded into CM_ENV ($count keys, project=$DOPPLER_PROJECT config=$DOPPLER_CONFIG)."
    - &pub_get
      name: Resolve dependencies
      script: flutter pub get
    - &setup_android_keystore
      name: Decode Android upload keystore
      script: |
        if [ -z "${TWIFFEL_CM_KEYSTORE:-}" ]; then
          echo "TWIFFEL_CM_KEYSTORE is not set. Add base64 keystore to Doppler ci."
          exit 1
        fi
        if [ -z "${TWIFFEL_CM_KEYSTORE_PASSWORD:-}" ] || \
           [ -z "${TWIFFEL_CM_KEY_ALIAS:-}" ] || \
           [ -z "${TWIFFEL_CM_KEY_PASSWORD:-}" ]; then
          echo "Need TWIFFEL_CM_KEYSTORE_PASSWORD, TWIFFEL_CM_KEY_ALIAS, TWIFFEL_CM_KEY_PASSWORD."
          exit 1
        fi
        # Trim whitespace/newlines that Doppler or CM_ENV can introduce.
        STORE_PW="$(printf '%s' "$TWIFFEL_CM_KEYSTORE_PASSWORD" | tr -d '\r\n')"
        KEY_PW="$(printf '%s' "$TWIFFEL_CM_KEY_PASSWORD" | tr -d '\r\n')"
        KEY_ALIAS="$(printf '%s' "$TWIFFEL_CM_KEY_ALIAS" | tr -d '\r\n')"
        # Strip whitespace/newlines from base64 (clipboard paste often wraps lines).
        B64="$(printf '%s' "$TWIFFEL_CM_KEYSTORE" | tr -d '[:space:]')"
        KEYSTORE_PATH="$CM_BUILD_DIR/twiffel-upload.jks"
        # openssl -A = single-line input; portable on Mac + Linux Codemagic images.
        printf '%s' "$B64" | openssl base64 -d -A -out "$KEYSTORE_PATH"
        ls -la "$KEYSTORE_PATH"
        # Fail here with a clear error instead of Gradle "final block not properly padded".
        if ! keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PW" \
            -keypass "$KEY_PW" >/tmp/keytool_list.out 2>/tmp/keytool_list.err; then
          echo "Keystore open failed. Check Doppler TWIFFEL_CM_KEYSTORE (base64) and passwords."
          cat /tmp/keytool_list.err >&2 || true
          exit 1
        fi
        cat /tmp/keytool_list.out
        printf '%s\n' \
          "storePassword=$STORE_PW" \
          "keyPassword=$KEY_PW" \
          "keyAlias=$KEY_ALIAS" \
          "storeFile=$KEYSTORE_PATH" \
          > "$CM_BUILD_DIR/android/key.properties"
        echo "Wrote android/key.properties (storeFile=$KEYSTORE_PATH)."

workflows:
  android:
    name: Twiffel Android
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - twiffel_ci
        - twiffel_runtime
    scripts:
      - *load_doppler_if_configured
      - *configure_private_git
      - *pub_get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - *setup_android_keystore
      - name: Build App Bundle
        script: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=TWIFFEL_API_BASE="${TWIFFEL_API_BASE:-}" \
            --dart-define=TWIFFEL_RC_KEY_ANDROID="${TWIFFEL_RC_KEY_ANDROID:-}"
    artifacts:
      - build/app/outputs/**/*.aab

  ios-smoke:
    name: Twiffel iOS (smoke)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - twiffel_ci
        - twiffel_runtime
    scripts:
      - *load_doppler_if_configured
      - *configure_private_git
      - *pub_get
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build iOS (unsigned)
        script: flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"
    artifacts:
      - build/ios/iphoneos/Runner.app

  ios-signed:
    name: Twiffel iOS (signed)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: twiffel_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Do not use ios_signing.distribution_type here — that only matches profiles
      # already uploaded in Codemagic UI. New apps need ASC fetch/create below.
      groups:
        - twiffel_ci
        - twiffel_runtime
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        BUNDLE_ID: com.uthings.twiffel
    scripts:
      - *load_doppler_if_configured
      - *configure_private_git
      - *pub_get
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create App Store signing files
        script: |
          # Apple may already have a Distribution cert from Stikkteller/Joppling.
          # Without the matching private key, fetch-signing-files fails with:
          #   "Cannot save Signing Certificates without certificate private key"
          # Store a PEM private key in Doppler ci as IOS_DISTRIBUTION_CERT_KEY
          # (team-wide, reuse for all U-Things apps). Generate once:
          #   openssl genrsa -out ios_distribution.key 2048
          #   Get-Content ios_distribution.key -Raw | doppler secrets set IOS_DISTRIBUTION_CERT_KEY --project twiffel --config ci
          CERT_KEY_FILE=/tmp/ios_distribution.key
          if [ -z "${DOPPLER_TOKEN:-}" ] || [ -z "${DOPPLER_PROJECT:-}" ]; then
            echo "DOPPLER_TOKEN / DOPPLER_PROJECT required to load IOS_DISTRIBUTION_CERT_KEY."
            exit 1
          fi
          DOPPLER_CONFIG="${DOPPLER_CONFIG:-ci}"
          if ! command -v doppler >/dev/null 2>&1; then
            brew list doppler >/dev/null 2>&1 || brew install dopplerhq/cli/doppler
          fi
          if ! doppler secrets get IOS_DISTRIBUTION_CERT_KEY \
              --project "$DOPPLER_PROJECT" \
              --config "$DOPPLER_CONFIG" \
              --plain > "$CERT_KEY_FILE.raw" 2>/tmp/cert_key_err; then
            echo "Missing Doppler ci secret IOS_DISTRIBUTION_CERT_KEY (PEM)."
            echo "Generate once and store in Doppler via CLI (preserves newlines):"
            echo "  openssl genrsa -out ios_distribution.key 2048"
            echo "  Get-Content ios_distribution.key -Raw | doppler secrets set IOS_DISTRIBUTION_CERT_KEY --project twiffel --config ci"
            cat /tmp/cert_key_err >&2 || true
            exit 1
          fi
          # Normalize Doppler UI paste issues: literal \n, CRLF.
          tr -d '\r' < "$CERT_KEY_FILE.raw" | sed 's/\\n/\n/g' > "$CERT_KEY_FILE"
          printf '\n' >> "$CERT_KEY_FILE"
          echo "PEM markers:"
          grep -E 'BEGIN|END' "$CERT_KEY_FILE" || true
          if ! grep -q 'BEGIN .*PRIVATE KEY' "$CERT_KEY_FILE"; then
            echo "IOS_DISTRIBUTION_CERT_KEY does not look like a PEM private key."
            echo "Re-set with Doppler CLI from the .key file (UI paste often breaks newlines)."
            exit 1
          fi
          if ! openssl rsa -in "$CERT_KEY_FILE" -check -noout 2>/tmp/openssl_check.err \
             && ! openssl pkey -in "$CERT_KEY_FILE" -check -noout 2>/tmp/openssl_check.err; then
            echo "IOS_DISTRIBUTION_CERT_KEY failed openssl check. Re-set via CLI from a .key file."
            cat /tmp/openssl_check.err >&2 || true
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@"$CERT_KEY_FILE"
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=TWIFFEL_API_BASE="${TWIFFEL_API_BASE:-}" \
            --dart-define=TWIFFEL_RC_KEY_IOS="${TWIFFEL_RC_KEY_IOS:-}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal Testing works even if external betaAppReviewSubmissions returns 422.
