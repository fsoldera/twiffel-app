# Codemagic CI/CD — customize for your app before first build.
# Full setup walkthrough + gotchas: harness/infrastructure-setup.md (step 4).
#
# TODO(template) — one app = one set of secrets, everything app-prefixed:
# - Rename env groups to <app>_github, <app>_runtime, <app>_secrets
# - Rename vars APP_* → <APP>_* (GITHUB_TOKEN → <APP>_GITHUB_TOKEN etc.)
# - Rename workflows, set bundle ID (com.uthings.<app>), ASC integration <app>_asc
# - Groups are app-level (free plan has no team groups); names here must match
#   the groups created on the app's Environment variables page exactly.
#
# Required Codemagic env groups:
#   <app>_github  — <APP>_GITHUB_TOKEN (repo scope) for private common-app-kit
#   <app>_runtime — <APP>_API_BASE
#   <app>_secrets — <APP>_RC_KEY_IOS, <APP>_RC_KEY_ANDROID, <APP>_CM_KEYSTORE* vars

definitions:
  scripts:
    - &configure_private_git
      name: Configure Git for private pub dependencies
      script: |
        if [ -z "$GITHUB_TOKEN" ]; then
          echo "GITHUB_TOKEN is not set."
          exit 1
        fi
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
    - &pub_get
      name: Resolve dependencies
      script: flutter pub get

workflows:
  android:
    name: Template Android
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - github_credentials
        - app_runtime
        - app_secrets
    scripts:
      - *configure_private_git
      - *pub_get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build App Bundle
        script: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_API_BASE="$APP_API_BASE" \
            --dart-define=APP_RC_KEY_ANDROID="$APP_RC_KEY_ANDROID"
    artifacts:
      - build/app/outputs/**/*.aab

  ios-smoke:
    name: Template iOS (smoke)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - github_credentials
        - app_runtime
        - app_secrets
    scripts:
      - *configure_private_git
      - *pub_get
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build iOS (unsigned)
        script: flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"
    artifacts:
      - build/ios/iphoneos/Runner.app
