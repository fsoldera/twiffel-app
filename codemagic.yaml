# Codemagic CI/CD for twiffel-app.
# Full setup walkthrough + gotchas: harness/infrastructure-setup.md (step 4).
# Store / RC launch order: harness/store-launch-checklist.md
# First-builds task: tasks/task-001-first-builds.md
#
# Secrets SoT = Doppler. Codemagic holds only:
#   twiffel_ci       — DOPPLER_TOKEN, DOPPLER_PROJECT=twiffel, DOPPLER_CONFIG=ci
#   twiffel_runtime  — TWIFFEL_API_BASE
#
# Doppler `ci` (or `prd`) should contain:
#   TWIFFEL_GITHUB_TOKEN, TWIFFEL_CM_KEYSTORE*, TWIFFEL_RC_KEY_* (RC optional at first)
#
# Fallback (mirror from Doppler — do not invent a 2nd SoT): add groups
#   twiffel_github / twiffel_secrets and list them under `groups:` below.
#
# Bundle ID: com.uthings.twiffel
# ASC integration name: twiffel_asc
# Start builds from the codemagic.yaml tab (not Workflow Editor).

definitions:
  scripts:
    - &configure_private_git
      name: Configure Git for private pub dependencies
      script: |
        TOKEN="${TWIFFEL_GITHUB_TOKEN:-${GITHUB_TOKEN:-}}"
        if [ -z "$TOKEN" ]; then
          echo "TWIFFEL_GITHUB_TOKEN (or GITHUB_TOKEN) is not set."
          echo "Put it in Doppler config ci, or set DOPPLER_TOKEN so secrets load."
          exit 1
        fi
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
    - &load_doppler_if_configured
      name: Load secrets from Doppler
      script: |
        # Doppler-first: these workflows require twiffel_ci (DOPPLER_TOKEN + project + config).
        # Do not soft-skip — a silent skip looks green and fails later on missing GitHub PAT.
        if [ -z "${DOPPLER_TOKEN:-}" ]; then
          echo "DOPPLER_TOKEN is not set in Codemagic group twiffel_ci."
          echo "Create: doppler configs tokens create --name twiffel-codemagic-ci --project twiffel --config ci --plain"
          exit 1
        fi
        if [ -z "${DOPPLER_PROJECT:-}" ]; then
          echo "DOPPLER_PROJECT missing (expected: twiffel) in group twiffel_ci."
          exit 1
        fi
        DOPPLER_CONFIG="${DOPPLER_CONFIG:-ci}"
        curl -Ls https://cli.doppler.com/install.sh | sh -s -- --no-install-pkgs
        # Append each app secret as KEY=value. Avoid `doppler … --format env` quotes /
        # multiline breakage from large keystore values that can drop later keys in CM_ENV.
        count=0
        for key in \
          TWIFFEL_GITHUB_TOKEN \
          TWIFFEL_CM_KEYSTORE \
          TWIFFEL_CM_KEYSTORE_PASSWORD \
          TWIFFEL_CM_KEY_ALIAS \
          TWIFFEL_CM_KEY_PASSWORD \
          TWIFFEL_RC_KEY_ANDROID \
          TWIFFEL_RC_KEY_IOS \
          TWIFFEL_XAI_MODEL
        do
          if ! doppler secrets get "$key" \
              --project "$DOPPLER_PROJECT" \
              --config "$DOPPLER_CONFIG" \
              --plain > /tmp/cm_doppler_val 2>/dev/null; then
            echo "skip missing Doppler secret: $key"
            continue
          fi
          printf '%s=' "$key" >> "$CM_ENV"
          cat /tmp/cm_doppler_val >> "$CM_ENV"
          printf '\n' >> "$CM_ENV"
          count=$((count + 1))
          echo "loaded $key"
        done
        rm -f /tmp/cm_doppler_val
        if ! grep -q "^TWIFFEL_GITHUB_TOKEN=" "$CM_ENV"; then
          echo "Doppler ci did not provide TWIFFEL_GITHUB_TOKEN (check Doppler config ci)."
          exit 1
        fi
        echo "Doppler secrets loaded into CM_ENV ($count keys, project=$DOPPLER_PROJECT config=$DOPPLER_CONFIG)."
    - &pub_get
      name: Resolve dependencies
      script: flutter pub get
    - &setup_android_keystore
      name: Decode Android upload keystore
      script: |
        if [ -z "${TWIFFEL_CM_KEYSTORE:-}" ]; then
          echo "TWIFFEL_CM_KEYSTORE is not set. Add base64 keystore to Doppler ci."
          exit 1
        fi
        if [ -z "${TWIFFEL_CM_KEYSTORE_PASSWORD:-}" ] || \
           [ -z "${TWIFFEL_CM_KEY_ALIAS:-}" ] || \
           [ -z "${TWIFFEL_CM_KEY_PASSWORD:-}" ]; then
          echo "Need TWIFFEL_CM_KEYSTORE_PASSWORD, TWIFFEL_CM_KEY_ALIAS, TWIFFEL_CM_KEY_PASSWORD."
          exit 1
        fi
        KEYSTORE_PATH="$CM_BUILD_DIR/twiffel-upload.jks"
        echo "$TWIFFEL_CM_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
        printf '%s\n' \
          "storePassword=$TWIFFEL_CM_KEYSTORE_PASSWORD" \
          "keyPassword=$TWIFFEL_CM_KEY_PASSWORD" \
          "keyAlias=$TWIFFEL_CM_KEY_ALIAS" \
          "storeFile=$KEYSTORE_PATH" \
          > "$CM_BUILD_DIR/android/key.properties"
        echo "Wrote android/key.properties (storeFile=$KEYSTORE_PATH)."

workflows:
  android:
    name: Twiffel Android
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - twiffel_ci
        - twiffel_runtime
    scripts:
      - *load_doppler_if_configured
      - *configure_private_git
      - *pub_get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - *setup_android_keystore
      - name: Build App Bundle
        script: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=TWIFFEL_API_BASE="${TWIFFEL_API_BASE:-}" \
            --dart-define=TWIFFEL_RC_KEY_ANDROID="${TWIFFEL_RC_KEY_ANDROID:-}"
    artifacts:
      - build/app/outputs/**/*.aab

  ios-smoke:
    name: Twiffel iOS (smoke)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - twiffel_ci
        - twiffel_runtime
    scripts:
      - *load_doppler_if_configured
      - *configure_private_git
      - *pub_get
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build iOS (unsigned)
        script: flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"
    artifacts:
      - build/ios/iphoneos/Runner.app

  ios-signed:
    name: Twiffel iOS (signed)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: twiffel_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.uthings.twiffel
      groups:
        - twiffel_ci
        - twiffel_runtime
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - *load_doppler_if_configured
      - *configure_private_git
      - *pub_get
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=TWIFFEL_API_BASE="${TWIFFEL_API_BASE:-}" \
            --dart-define=TWIFFEL_RC_KEY_IOS="${TWIFFEL_RC_KEY_IOS:-}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal Testing works even if external betaAppReviewSubmissions returns 422.
