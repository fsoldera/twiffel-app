name: uthings_app_template
description: >-
  U-Things app template — Flutter + common_app_kit + Cloudflare Worker.
  Copy this repo to start a new native iOS/Android app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  common_app_kit:
    git:
      url: https://github.com/fsoldera/common-app-kit.git
      ref: v0.3.0
  go_router: ^17.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
