name: twiffel_app
description: >-
  Twiffel — Flutter + common_app_kit + Cloudflare Worker.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  common_app_kit:
    git:
      url: https://github.com/fsoldera/common-app-kit.git
      ref: v0.3.0
  go_router: ^17.3.0
  http: ^1.2.0
  flutter_native_splash: ^2.4.6
  google_fonts: ^6.2.1
  pdf: ^3.13.0
  printing: ^5.15.0
  intl: ^0.20.3
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logos/
    - assets/icons/
    - assets/report/
    - assets/splash/
    - assets/animations/
    - assets/copy/
    - assets/onboarding/android/
    - assets/onboarding/ios/

# Launcher / home-screen icon. Play compares this to the 512 listing icon.
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/twiffel-icon-1024.png
  adaptive_icon_background: "#1E1E1E"
  adaptive_icon_foreground: assets/icons/twiffel-icon-1024.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  remove_alpha_ios: true

# Native launch splash. Android is generated here. iOS uses the Figma
# full-bleed LaunchImage in ios/Runner/Assets.xcassets (do not set ios: true
# or `flutter_native_splash:create` will overwrite those screens).
#   dart run flutter_native_splash:create
flutter_native_splash:
  # Figma stacked logo on the launch plate (light/dark).
  # Note: Android 12+ still applies a system circular mask to the splash icon.
  color: "#FFFFFF"
  color_dark: "#1F2937"
  image: assets/splash/splash_logo_light.png
  image_dark: assets/splash/splash_logo.png
  android: true
  ios: false
  android_12:
    color: "#FFFFFF"
    color_dark: "#1F2937"
    image: assets/splash/splash_icon_light.png
    image_dark: assets/splash/splash_icon.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#1F2937"
