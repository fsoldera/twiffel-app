name: twiffel_app
description: >-
  Twiffel — Flutter + common_app_kit + Cloudflare Worker.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  common_app_kit:
    git:
      url: https://github.com/fsoldera/common-app-kit.git
      ref: v0.3.0
  go_router: ^17.3.0
  http: ^1.2.0
  flutter_native_splash: ^2.4.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logos/
    - assets/icons/
    - assets/splash/
    - assets/animations/
    - assets/copy/

# Native launch splash (Android + iOS). Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # Figma stacked logo on the launch plate (light/dark).
  # Note: Android 12+ still applies a system circular mask to the splash icon.
  color: "#FFFFFF"
  color_dark: "#1F2937"
  image: assets/splash/splash_logo_light.png
  image_dark: assets/splash/splash_logo.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    color_dark: "#1F2937"
    image: assets/splash/splash_icon_light.png
    image_dark: assets/splash/splash_icon.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#1F2937"
