name = "twiffel-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "twiffel_events"

# Non-secret defaults. Worker secret DOPPLER_SERVICE_TOKEN via `wrangler secret put`.
[vars]
DOPPLER_PROJECT = "twiffel"
DOPPLER_CONFIG = "prd"
TWIFFEL_XAI_MODEL = "grok-4.3"
TWIFFEL_XAI_BASE_URL = "https://eu-west-1.api.x.ai/v1"
TWIFFEL_XAI_REASONING_EFFORT = "low"
TWIFFEL_XAI_TEMPERATURE = "0.7"
