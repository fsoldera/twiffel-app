name = "twiffel-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "twiffel_events"

# Non-secret defaults. Worker secret DOPPLER_SERVICE_TOKEN via `wrangler secret put`.
[vars]
DOPPLER_PROJECT = "twiffel"
DOPPLER_CONFIG = "prd"
TWIFFEL_XAI_MODEL = "grok-3-mini"
